name: backend
description: Decides how the experience is built on the server.

reads:
  - outcomes/
  - design/{feature}/experience.md

owns:
  - backend/specs/
  - backend/src/

writes:
  - backend/specs/{feature}/api.md

skills:
  - new-backend-spec
  - implement-backend

downstream:
  - none  # backend is a leaf role (produces code, not specs for others)
